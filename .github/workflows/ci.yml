name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep in-progress Docker jobs alive when a later dispatch/rerun is queued.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, build, E2E, public demo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize database schema
        run: npm run db:init

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

      - name: Production build
        run: npm run build

      - name: Local-mode Playwright E2E
        run: npm run test:e2e

      - name: Public-demo verification smoke
        run: npm run verify:public-demo

      - name: Public-demo Playwright E2E
        run: npm run test:e2e:public-demo

      - name: Upload public-demo Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-demo-playwright-artifacts
          path: |
            playwright-report-public-demo/
            test-results-public-demo/
          if-no-files-found: ignore
          retention-days: 7

  docker-public-demo:
    name: Docker public-demo build and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Build public-demo image
        run: docker build -t applyready-public-demo:ci .

      - name: Start public-demo container
        run: |
          docker run -d \
            --name applyready-public-demo-ci \
            -e PUBLIC_DEMO_MODE=true \
            -e NODE_ENV=production \
            -e HOST=0.0.0.0 \
            -e PORT=8787 \
            -e APPLYREADY_DATA_DIR=/tmp/applyready-data \
            -e APPLYREADY_UPLOADS_DIR=/tmp/applyready-uploads \
            -e APPLYREADY_DB_PATH=/tmp/applyready-data/applyready.sqlite \
            -e PUBLIC_DEMO_TTL_HOURS=6 \
            -p 8787:8787 \
            applyready-public-demo:ci

      - name: Smoke test container API
        run: |
          APPLYREADY_SMOKE_BASE_URL=http://127.0.0.1:8787 \
            node scripts/ci-public-demo-smoke.mjs

      - name: Print container logs on failure
        if: failure()
        run: docker logs applyready-public-demo-ci | sed -E 's#(/[A-Za-z0-9._-]+){2,}#[path]#g' || true

      - name: Remove container
        if: always()
        run: |
          docker rm -f applyready-public-demo-ci || true
